# Include near the start of the public Rinspace nginx `server` block, before proxy locations.
if ($rinspace_federation_request) {
  return 404;
}

location = /api/v1/instance/peers {
  add_header Cache-Control "no-store" always;
  add_header X-Rinspace-Local-Only "blocked" always;
  default_type application/json;
  return 404 '{"error":"not_found","code":"local_only.federation_disabled"}';
}
