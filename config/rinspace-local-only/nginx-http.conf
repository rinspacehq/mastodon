# Include from the nginx `http` block. The server include below depends on it.
map $request_uri $rinspace_federation_path {
  default 0;
  ~^/(?:\.well-known/(?:host-meta|nodeinfo|webfinger)|nodeinfo(?:/|$)|actor(?:/|$)|inbox(?:/|$)|ap(?:/|$)|collections(?:/|$)|contexts(?:/|$)|users(?:/|$)|@[^/]*@[^/]+(?:/|$)|authorize_follow(?:/|$)|authorize_interaction(?:/|$)|remote_interaction_helper(?:/|$)|admin/(?:domain_allows|domain_blocks|fasp|instances|relays)(?:/|$)|api/v1/instance/peers(?:/|$)|api/v1/admin/(?:domain_allows|domain_blocks)(?:/|$)) 1;
}

map $http_accept $rinspace_activitypub_accept {
  default 0;
  ~*application/activity\+json 1;
  ~*application/ld\+json[^,]*activitystreams 1;
}

map "$rinspace_federation_path:$rinspace_activitypub_accept" $rinspace_federation_request {
  default 0;
  ~^1: 1;
  ~:1$ 1;
}
